[project]
name = "replay-anything"
version = "0.2.0"
description = "Turn repeated website operations into named, verified recipes that agents run in one step."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [{name = "ness001"}]
dependencies = [
    "pyyaml>=6",
    "jsonpath-ng>=1.6",
    "httpx>=0.27",
    "websockets>=13",
    "playwright>=1.51",
    "mcp>=2.3",
    "platformdirs>=4",
]

[project.optional-dependencies]
test = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["replay-anything[test]", "ruff==0.17.3"]

[project.scripts]
replay-anything = "replay_anything.cli:main"
replay-anything-mcp = "replay_anything.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["replay_anything"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = ["browser: drives a real Chromium browser (Edge/Chrome or playwright's)"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares request parameters as File(...), Form(...), Header(...) defaults
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
# embedded JavaScript and JSON fixtures read better on one line
"replay_anything/browser.py" = ["E501"]
"tests/chat_site.py" = ["E501"]
"tests/test_interop.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["replay_anything"]
